name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets
        run: |
          if grep -rE "(PLAYFAB_DEV_SECRET_KEY|unity_password|api_key\s*=\s*['\"][^'\"]+)" \
            --include="*.cs" --include="*.json" --include="*.yaml" \
            --exclude-dir=.github . 2>/dev/null; then
            echo "::error::Potential secret found in source files"
            exit 1
          fi
          echo "Secret scan passed."

